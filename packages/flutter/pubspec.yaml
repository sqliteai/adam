name: sqlite_adam
version: 0.7.0
description: >
  Adam is an embeddable AI agent library for SQLite, providing on-device
  chat, voice, vision, memory, and tool-calling. It works seamlessly on
  iOS, Android, Windows, Linux, and macOS, integrating directly with
  your embedded SQLite database.
homepage: https://github.com/sqliteai/adam
repository: https://github.com/sqliteai/adam

environment:
  sdk: ^3.10.0

dependencies:
  code_assets: ^1.0.0
  hooks: ^1.0.0
  path: ^1.8.0
  sqlite3: ^3.0.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.24.0
